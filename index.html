<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Show do Milhão: Edição Microplásticos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b192c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background: linear-gradient(135deg, #1e3e62, #000000);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        /* Tela Inicial */
        #screen-start h1 {
            font-size: 2.5rem;
            color: #ffcc00;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #screen-start h1 span {
            color: #00ffcc;
        }

        #screen-start p {
            font-size: 1rem;
            margin-bottom: 30px;
            color: #cfd8dc;
        }

        /* Botões Estilo Show do Milhão */
        .btn {
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.4);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: linear-gradient(to bottom, #e53935, #c62828);
            color: #fff;
            box-shadow: 0 4px 10px rgba(229, 57, 53, 0.4);
        }

        /* Jogo */
        .game-header {
            display: flex;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            color: #ffcc00;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffcc00;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-box p {
            font-size: 1.05rem;
            line-height: 1.4;
            text-align: left;
            width: 100%;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .option-btn {
            background: linear-gradient(to right, #1e3e62, #2b5886);
            border: 2px solid #4a90e2;
            color: #ffffff;
            padding: 14px;
            text-align: left;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn.correct {
            background: linear-gradient(to right, #2e7d32, #43a047) !important;
            border-color: #66bb6a !important;
        }

        .option-btn.wrong {
            background: linear-gradient(to right, #c62828, #e53935) !important;
            border-color: #ef5350 !important;
        }

        .decision-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b192c">
</head>
<body>
    <div id="game-container">
        <!-- Tela Inicial -->
        <div id="screen-start" class="screen active">
            <h1>Show dos<br><span>Microplásticos</span></h1>
            <p>Teste seus conhecimentos sobre a ameaça invisível dos oceanos!</p>
            <button id="btn-start" class="btn">INICIAR JOGO</button>
        </div>

        <!-- Tela do Jogo -->
        <div id="screen-game" class="screen">
            <header class="game-header">
                <div id="level-indicator">Nível: <span id="current-level">1</span>/5</div>
            </header>

            <div class="question-box">
                <p id="question-text">Carregando pergunta...</p>
            </div>

            <div class="options-grid" id="options-container"></div>
        </div>

        <!-- Tela de Decisão (Parar ou Arriscar) -->
        <div id="screen-decision" class="screen">
            <h2>Resposta Correta!</h2>
            <p id="decision-text" style="margin: 20px 0; font-size: 1.1rem;">Você deseja parar por aqui e garantir o seu avanço ou quer arriscar o próximo nível?</p>
            <div class="decision-buttons">
                <button id="btn-risk" class="btn">ARRISCAR PRÓXIMO NÍVEL</button>
                <button id="btn-stop" class="btn btn-secondary">PARAR POR AQUI</button>
            </div>
        </div>

        <!-- Tela de Fim de Jogo -->
        <div id="screen-gameover" class="screen">
            <h2 id="gameover-title">Fim de Jogo</h2>
            <p id="gameover-message">Você chegou até aqui!</p>
            <button id="btn-restart" class="btn" style="margin-top: 20px;">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script>
        // Banco de perguntas completo baseado nos 5 níveis dos PDFs oficiais
        const levelsData = [
            // NÍVEL 1
            [
                {
                    question: "O que são microplásticos de acordo com a definição científica?",
                    options: [
                        "Grandes pedaços de plástico boiando no oceano com mais de 10 centímetros.",
                        "Pequenas partículas de plástico com 5 milímetros de diâmetro ou menos.",
                        "Garrafas PET inteiras recicladas e transformadas em sacolas de pano.",
                        "Vidros moídos em praias que se parecem visualmente com plástico."
                    ],
                    answer: 1
                },
                {
                    question: "Quais são as três principais vias pelas quais os microplásticos entram no corpo humano?",
                    options: [
                        "Visão, audição e tato.",
                        "Alimentação, inalação (respiração) e contato com a pele.",
                        "Exclusivamente pela ingestão de água engarrafada.",
                        "Transpiração, injeção e digestão de vegetais."
                    ],
                    answer: 1
                },
                {
                    question: "Qual das opções abaixo representa uma das três maiores fontes originais de microplásticos no meio ambiente?",
                    options: [
                        "Papelão molhado jogado nas calçadas.",
                        "Desgaste de pneus nas ruas e rodovias.",
                        "Telhas de cerâmica velhas caindo dos telhados.",
                        "Vidros quebrados nas faixas de areia das praias."
                    ],
                    answer: 1
                }
            ],
            // NÍVEL 2
            [
                {
                    question: "Qual é a diferença fundamental entre microplásticos PRIMÁRIOS e SECUNDÁRIOS?",
                    options: [
                        "Os primários vêm de garrafas velhas; os secundários vêm de pneus novos.",
                        "Os primários são fabricados propositalmente em tamanho pequeno; os secundários surgem da degradação de plásticos maiores.",
                        "Os primários são de origem natural; os secundários são produzidos por animais marinhos.",
                        "Os primários flutuam na água doce; os secundários afundam na água salgada."
                    ],
                    answer: 1
                },
                {
                    question: "Como os microplásticos impactam a flora marinha, em especial o fitoplâncton?",
                    options: [
                        "Fazem o fitoplâncton crescer e se multiplicar dez vezes mais rápido.",
                        "Podem causar o sufocamento do fitoplâncton, levando à queda na produção de oxigênio.",
                        "São absorvidos pelo fitoplâncton e transformados em açúcar comestível.",
                        "Tornam as algas transparentes e imunes à luz solar."
                    ],
                    answer: 1
                },
                {
                    question: "Além de sacolas e garrafas, qual item comum do cotidiano pode liberar microplásticos ao entrar em contato com água quente?",
                    options: [
                        "Saquinhos de chá com malha sintética/plástica.",
                        "Colheres de pau de cozinha.",
                        "Copos de vidro temperado.",
                        "Filtros de papel para coar café."
                    ],
                    answer: 0
                }
            ],
            // NÍVEL 3
            [
                {
                    question: "Como se originam os microplásticos SECUNDÁRIOS no meio ambiente?",
                    options: [
                        "São sintetizados diretamente em laboratórios de biologia.",
                        "Resultam da degradação mecânica, do sol (raios UV) e do vento sobre plásticos maiores descartados no ecossistema.",
                        "São produzidos pela reação do sal do mar com as pedras da praia.",
                        "Nascem das raízes de árvores em florestas tropicais."
                    ],
                    answer: 1
                },
                {
                    question: "Segundo as pesquisas médicas atuais, quais são os potenciais impactos dos microplásticos no corpo humano?",
                    options: [
                        "Aumento da força muscular e melhora imediata da visão.",
                        "Inflamação crônica, danos celulares/teciduais e problemas cardiovasculares.",
                        "Cura automática de infecções bacterianas.",
                        "Fortalecimento do esmalte dos dentes e ossos."
                    ],
                    answer: 1
                },
                {
                    question: "Por que o ato de aquecer alimentos ou bebidas em recipientes de plástico deve ser evitado?",
                    options: [
                        "Porque o pote absorve o cheiro do alimento e muda sua cor.",
                        "Porque o calor acelera a degradação do plástico, liberando milhões de micropartículas e compostos químicos na comida.",
                        "Porque o micro-ondas deixa de funcionar ao entrar em contato com o plástico.",
                        "Porque o alimento perde instantaneamente todas as suas calorias."
                    ],
                    answer: 1
                }
            ],
            // NÍVEL 4
            [
                {
                    question: "Lavar roupas de tecidos sintéticos (como poliéster e nylon) solta milhares de microfibras. Qual procedimento reduz essa liberação?",
                    options: [
                        "Lavar com água fervendo em ciclos extremamente longos e intensos.",
                        "Lavar com água fria e utilizar ciclos de lavagem mais curtos.",
                        "Usar alvejante forte e esfregar as peças com escova de aço.",
                        "Deixar a roupa de molho no sol forte por vários dias antes de lavar."
                    ],
                    answer: 1
                },
                {
                    question: "Por que a redução na produção de oxigênio pelo fitoplâncton, causada pelo sufocamento por microplásticos, é uma ameaça global?",
                    options: [
                        "Porque o oxigênio marinho é o único gás usado na quebra de foguetes.",
                        "Porque o fitoplâncton marinho é responsável por produzir mais de 50% do oxigênio que respiramos no planeta.",
                        "Porque sem oxigênio marinho, as nuvens de chuva deixam de se formar no céu.",
                        "Porque o oxigênio do mar impede que a Terra saia de sua órbita."
                    ],
                    answer: 1
                },
                {
                    question: "Como os microplásticos atuam no transporte de substâncias perigosas para os animais (a chamada 'carga tóxica')?",
                    options: [
                        "Eles repelem toda a sujeira, limpando o estômago do peixe.",
                        "Eles funcionam como 'esponjas', absorvendo poluentes químicos da água e liberando essas toxinas no organismo do animal que os ingere.",
                        "Eles transformam os órgãos internos do animal em minerais cristalinos.",
                        "Eles impedem que o animal sinta sede em água salgada."
                    ],
                    answer: 1
                }
            ],
            // NÍVEL 5
            [
                {
                    question: "Ao analisar as três maiores fontes de microplásticos (roupas sintéticas, pneus e lixo plástico), qual é o ponto em comum no ciclo de contaminação marinha?",
                    options: [
                        "Nenhuma dessas fontes depende da ação do vento ou das chuvas para chegar aos rios.",
                        "Todas decorrem de atividades humanas cotidianas e geram partículas difusas que são carreadas pela água das chuvas e esgotos até os oceanos.",
                        "Todas são produzidas exclusivamente por grandes navios cargueiros no meio do oceano.",
                        "Elas se desintegram em menos de 24 horas ao entrar em contato com a água salgada."
                    ],
                    answer: 1
                },
                {
                    question: "Por que o microplástico é considerado um 'poluente invisível e altamente persistente'?",
                    options: [
                        "Porque ele se dissolve quimicamente em poucas horas na água do mar.",
                        "Porque seu tamanho microscópico dificulta a identificação e recolhimento, enquanto sua estrutura sintética leva até séculos para se decompor.",
                        "Porque ele voa para fora da atmosfera terrestre logo após ser descartado no lixo.",
                        "Porque ele se transforma em gás carbônico assim que toca o solo."
                    ],
                    answer: 1
                },
                {
                    question: "Em uma apresentação na Feira de Ciências, como você resumiria a relação entre a preservação dos oceanos contra microplásticos e a saúde humana?",
                    options: [
                        "A poluição marinha afeta apenas os peixes; os seres humanos estão imunes a qualquer impacto.",
                        "A poluição afeta a base da vida marinha (fitoplâncton), prejudicando a produção de oxigênio do planeta e retornando aos humanos pela alimentação, inalação e contato.",
                        "Parar de comer peixe elimina 100% dos microplásticos presentes no ar e na água potável.",
                        "O oceano degrada todo o plástico em nutrientes benéficos para a saúde humana."
                    ],
                    answer: 1
                }
            ]
        ];

        let currentLevel = 0;
        let currentQuestion = null;

        const screenStart = document.getElementById("screen-start");
        const screenGame = document.getElementById("screen-game");
        const screenDecision = document.getElementById("screen-decision");
        const screenGameover = document.getElementById("screen-gameover");

        const btnStart = document.getElementById("btn-start");
        const btnRestart = document.getElementById("btn-restart");
        const btnRisk = document.getElementById("btn-risk");
        const btnStop = document.getElementById("btn-stop");

        const textQuestion = document.getElementById("question-text");
        const containerOptions = document.getElementById("options-container");
        const currentLevelIndicator = document.getElementById("current-level");

        const gameoverTitle = document.getElementById("gameover-title");
        const gameoverMessage = document.getElementById("gameover-message");

        btnStart.addEventListener("click", startGame);
        btnRestart.addEventListener("click", startGame);
        btnRisk.addEventListener("click", nextLevelOrWin);
        btnStop.addEventListener("click", stopGame);

        function startGame() {
            currentLevel = 0;
            screenStart.classList.remove("active");
            screenDecision.classList.remove("active");
            screenGameover.classList.remove("active");
            screenGame.classList.add("active");
            loadQuestion();
        }

        function loadQuestion() {
            currentLevelIndicator.textContent = currentLevel + 1;
            
            const pool = levelsData[currentLevel];
            const randomIndex = Math.floor(Math.random() * pool.length);
            currentQuestion = pool[randomIndex];

            textQuestion.textContent = currentQuestion.question;
            
            containerOptions.innerHTML = "";
            currentQuestion.options.forEach((opt, index) => {
                const button = document.createElement("button");
                button.classList.add("option-btn");
                button.textContent = `${String.fromCharCode(65 + index)}) ${opt}`;
                button.addEventListener("click", () => selectOption(index, button));
                containerOptions.appendChild(button);
            });
        }

        function selectOption(selectedIndex, buttonElement) {
            const allButtons = containerOptions.querySelectorAll(".option-btn");
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQuestion.answer) {
                buttonElement.classList.add("correct");
                setTimeout(() => {
                    if (currentLevel === levelsData.length - 1) {
                        endGame(true, "PARABÉNS! ESPECIALISTA!", "Você completou todos os níveis do quiz de microplásticos com excelência!");
                    } else {
                        screenGame.classList.remove("active");
                        screenDecision.classList.add("active");
                    }
                }, 1500);
            } else {
                buttonElement.classList.add("wrong");
                allButtons[currentQuestion.answer].classList.add("correct");
                setTimeout(() => {
                    endGame(false, "FIM DE JOGO!", `Você errou no Nível ${currentLevel + 1}. Continue estudando sobre a preservação dos oceanos!`);
                }, 2000);
            }
        }

        function nextLevelOrWin() {
            currentLevel++;
            screenDecision.classList.remove("active");
            screenGame.classList.add("active");
            loadQuestion();
        }

        function stopGame() {
            endGame(true, "JOGO ENCERRADO COM SUCESSO!", `Você parou no Nível ${currentLevel + 1} e garantiu o seu conhecimento em proteção ambiental!`);
        }

        function endGame(won, title, message) {
            screenGame.classList.remove("active");
            screenDecision.classList.remove("active");
            screenGameover.classList.add("active");
            
            gameoverTitle.textContent = title;
            gameoverMessage.textContent = message;
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
